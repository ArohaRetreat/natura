<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hrudhi - draft rig integration</title><style>body{font:17px/1.6 system-ui;color:#294f38;background:white;margin:30px auto;padding:0 20px;max-width:800px}h1{font:42px Georgia,serif}label{display:inline-grid;margin:8px 12px 8px 0;gap:4px}select,button{font:inherit;padding:9px;border:1px solid #819b62;border-radius:6px;background:white;color:inherit}button{cursor:pointer}#stage{height:520px;text-align:center}svg{height:100%;max-width:100%}a{color:inherit}</style><h1>Hrudhi's motion study</h1><p><strong>Draft / family review pending.</strong> Simplified editable vector interpretation. No audio or AI service is connected.</p><label>Chapter<select id="chapter"></select></label><label>Wardrobe<select id="season"></select></label><label>Action<select id="state"></select></label><div id="stage"></div><button id="play">Play once</button> <button id="pause">Pause</button><label>Timeline<input id="seek" type="range" min="0" max="100" value="0"></label><p id="status" role="status"></p><p><a href="docs/hrudhi/Character-Bible.html">Read the character bible and integration contract</a></p><script type="module">
import {chapters,seasons,motions} from './assets/hrudhi/runtime/definition.js';import {renderHrudhi} from './assets/hrudhi/runtime/rig.js';import {createHrudhiPlayer} from './assets/hrudhi/runtime/player.js';let player,raf;const $=s=>document.getElementById(s);for(const [id,items] of [['chapter',chapters.map(c=>[c.id,c.label])],['season',seasons.map(s=>[s,s])],['state',Object.entries(motions).map(([k,v])=>[k,v.label])]])for(const [value,label] of items)$(id).add(new Option(label,value));const reduced=matchMedia('(prefers-reduced-motion: reduce)');function render(){player?.dispose();cancelAnimationFrame(raf);const o={chapter:$('chapter').value,season:$('season').value,state:$('state').value};$('stage').innerHTML=renderHrudhi(o);player=createHrudhiPlayer($('stage').querySelector('svg'),o);$('play').disabled=player.reducedMotion;$('status').textContent=player.reducedMotion?'Still preview / reduced motion':'Ready / press Play';$('seek').value=player.reducedMotion?100:0;}function tick(){$('seek').value=player.progress*100;if(player.playing)raf=requestAnimationFrame(tick);else $('status').textContent='Paused or complete';}for(const id of ['chapter','season','state'])$(id).onchange=render;$('play').onclick=()=>{cancelAnimationFrame(raf);player.play();$('status').textContent='Playing once';tick();};$('pause').onclick=()=>{player.pause();cancelAnimationFrame(raf);$('status').textContent='Paused';};$('seek').oninput=()=>{player.pause();player.seek(Number($('seek').value)/100);};document.addEventListener('visibilitychange',()=>{if(document.hidden){player.pause();cancelAnimationFrame(raf);}});reduced.addEventListener('change',render);window.addEventListener('pagehide',()=>player.dispose());render();
</script></html>
